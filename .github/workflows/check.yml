name: Check

on:
  push:
  pull_request:

jobs:
  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild assets
        run: python tools/build.py
      - name: Check README links
        run: python tools/check_readme_links.py
      - name: Check deterministic generated tokens are committed
        run: git diff --exit-code -- colors/colors.css colors/colors.json colors/colors.scss
